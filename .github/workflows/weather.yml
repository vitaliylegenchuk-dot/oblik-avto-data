name: Погода на дорогах
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "1 4,5 * * *"   # ранковий запуск після тихої години (07:01 за Києвом узимку й улітку)
  workflow_dispatch:
  push:
    paths: ["scripts/weather.py", "scripts/push.py", ".github/workflows/weather.yml"]
permissions:
  contents: write
concurrency: weather
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Оновити weather.json
        run: python scripts/weather.py
      - name: Пуш-сповіщення
        env: { FCM_SA: "${{ secrets.FCM_SA }}" }
        run: |
          pip install -q google-auth requests
          python scripts/push.py
      - name: Зберегти
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json; git add -A push_sent.json push_log.txt push_test.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Погода: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
